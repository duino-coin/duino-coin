name: Update Copyright Year

on:
  schedule:
    - cron: '01 0 1 1 *'  # January 1, 00:01 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-copyright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Update copyright years
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import re

          year = str(datetime.now(timezone.utc).year)

          replacements = {
              "LICENSE": r'(Copyright \(c\) \d{4}-)\d{4}',
              "README.md": r'(by Kristian \(Tech1k\) and Revox, 2021-)\d{4}',
          }

          for filename, pattern in replacements.items():
              path = Path(filename)
              if not path.is_file():
                  continue
              content = path.read_text(encoding="utf-8")
              updated = re.sub(pattern, lambda m: m.group(1) + year, content)
              if updated != content:
                  path.write_text(updated, encoding="utf-8")
                  print(f"updated {filename}")
          PY

      - name: Commit changes
        run: |
          if ! git diff --quiet -- LICENSE README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add LICENSE README.md
            git commit -m "chore: Update copyright year (auto)"
            git push origin HEAD:gh-pages
          fi
